name: Deploy translations

on:
  push:
    branches: [main]
    paths: [translations/*.ts]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: Install lrelease
        run: |
          sudo apt-get update
          sudo apt-get install -y qttools5-dev-tools
          command -v lrelease-qt5 || command -v lrelease

      - name: Clear old translations content
        run: rm -rf site/translations

      - name: Compile .qm files
        run: |
          set -e
          mkdir -p site/translations
          cp translations/*.ts site/translations/
          for f in site/translations/*.ts; do
            key=$(basename "$f" .ts)
            lrelease -removeidentical "$f" -qm "site/translations/mmc_${key}.qm" || true
          done
          ls -la site/translations/

      - name: Generate index_v2.json
        run: python3 .github/workflows/make_translation_index.py site/translations/

      - name: Rebuild landing page
        run: |
          set -euo pipefail
          {
            echo "<html><body>"
            echo "<h1>PollyMC-Continued</h1>"
            if [ -d site/apt ]; then
              echo "<p><a href=\"apt/\">apt</a> - Debian/Ubuntu .deb packages</p>"
            fi
            if [ -d site/arch ]; then
              echo "<p><a href=\"arch/\">arch</a> - Arch Linux pacman packages</p>"
            fi
            echo "<p><a href=\"translations/\">translations</a> - Compiled .qm translation files</p>"
            echo "</body></html>"
          } > site/index.html

      - name: Commit and push to gh-pages
        run: |
          set -euo pipefail
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update translations"
            for i in $(seq 1 5); do
              if git push; then
                break
              fi
              echo "Push rejected, rebasing and retrying ($i/5)..."
              git fetch origin gh-pages
              git rebase origin/gh-pages
            done
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4